[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[dependencies]
core = { path = "../core" }
models = { path = "../models" }
command-bus = { path = "../command-bus"}
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui_commonmark = "0.23.0"
image = "0.25.10"
rfd = "0.17.2"
dashmap = "6.2.1"
log = "0.4.33"

[target.'cfg(not (target_arch = "wasm32"))'.dependencies]
tokio =  { version = "1.50.0", features=["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
poll-promise = { version = "0.3", features = ["web"] }
anyhow = "1.0.103"